name: Build AX1800 Pro OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Init Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
        cd openwrt
        # 添加 Lucky 插件源
        echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git' >> feeds.conf.default

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Firmware
      run: |
        cd openwrt
        # 生成默认配置
        make defconfig
        
        # === 核心修复区 ===
        
        # 1. 设定目标设备 (IPQ60xx / AX1800 Pro)
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_ax1800-pro=y" >> .config
        
        # 2. 解决 mwan3 与 dnsmasq 的冲突 (这是 Exit Code 2 的元凶)
        # 移除基础版 dnsmasq
        sed -i 's/^CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
        # 启用 dnsmasq-full 并开启 ipset 支持
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq_full_ipset=y" >> .config
        # 启用 mwan3 及依赖
        echo "CONFIG_PACKAGE_mwan3=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_ipset=y" >> .config
        
        # 3. 启用 USB 5G 模组支持 (移花接木，防止驱动打架)
        echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-qmi=y" >> .config
        echo "CONFIG_PACKAGE_usbutils=y" >> .config
        
        # 4. 启用 Lucky
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config

        # 5. 再次整理依赖
        make defconfig

    - name: Download Packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 首次尝试多线程编译
        make -j$(nproc) || make -j1 V=s
        
    - name: Upload Firmware
      uses: actions/upload-artifact@v3
      with:
        name: OpenWrt_Firmware
        path: openwrt/bin/targets/