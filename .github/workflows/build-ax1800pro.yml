name: Build AX1800 Pro OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Init Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Update Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Config
      run: |
        [ -e .config ] || make defconfig
        
        # === 基础 LuCI 环境 (防依赖丢失) ===
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-compat=y" >> .config
        echo "CONFIG_PACKAGE_libiwinfo-lua=y" >> .config
        
        # === 核心插件强制注入 ===
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        
        # === mwan3 & dnsmasq-full 冲突终极解决方案 ===
        # 先把原来的 dnsmasq 删干净
        sed -i '/CONFIG_PACKAGE_dnsmasq=y/d' .config
        sed -i '/CONFIG_PACKAGE_dnsmasq_full/d' .config
        echo "# CONFIG_PACKAGE_dnsmasq is not set" >> .config
        # 显式启用 full 版本
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq_full_ipset=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq_full_conntrack=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq_full_noid=y" >> .config
        
        # === mwan3 及其依赖 ===
        echo "CONFIG_PACKAGE_mwan3=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_ipset=y" >> .config
        echo "CONFIG_PACKAGE_iptables-mod-ipopt=y" >> .config
        
        # === 5G 模组驱动 ===
        echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-qmi=y" >> .config
        
        # === 随身WiFi 加速驱动 (NCM/RNDIS) ===
        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-ncm=y" >> .config
        echo "CONFIG_PACKAGE_usbutils=y" >> .config
        
        # === 执行依赖计算 ===
        make defconfig
        
        # === 再次检查并强制修正 (防止 defconfig 把它们扔了) ===
        sed -i 's/# CONFIG_PACKAGE_dnsmasq is not set/CONFIG_PACKAGE_dnsmasq-full=y/' .config
        sed -i 's/# CONFIG_PACKAGE_luci-app-openclash is not set/CONFIG_PACKAGE_luci-app-openclash=y/' .config
        
        # === 最终调试输出 ===
        echo "=== FINAL CONFIG CHECK ==="
        grep -E "luci-app-openclash|dnsmasq|mwan3|qmi-wwan|luci-app-store" .config || true
    - name: Download Packages
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt_Firmware
        path: bin/targets/